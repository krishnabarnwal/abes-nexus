name: abes_net
description: A Flutter application designed to automate captive-portal Wi-Fi logins.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^9.0.0
  workmanager: ^0.10.7
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
