name: abes_net
description: A Flutter application designed to automate captive-portal Wi-Fi logins.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^9.0.0
  workmanager: ^0.10.7
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
